plugins {
    id 'com.android.application'
}

// Signing passwords live in keystore.properties (not committed). Keep builderday.jks backed up:
// updates to the installed app must be signed with the same key.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.builderday.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.builderday.tracker'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('builderday.jks')
            storePassword ksProps['storePassword']
            keyAlias 'builderday'
            keyPassword ksProps['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
