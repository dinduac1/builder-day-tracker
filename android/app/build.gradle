plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Signing passwords live in keystore.properties (not committed). Keep builderday.jks backed up:
// updates to the installed app must be signed with the same key.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.builderday.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ordo.app'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '3.6'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('builderday.jks')
            storePassword ksProps['storePassword']
            keyAlias 'builderday'
            keyPassword ksProps['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native Google sign-in (Credential Manager), handed to the page's Firebase login
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Camera photos handed to the page (FileProvider)
    implementation 'androidx.core:core:1.13.1'
    // Crew alerts (push)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
