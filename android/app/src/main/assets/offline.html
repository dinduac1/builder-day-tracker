<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDO</title>
<style>
html,body{margin:0;height:100%;background:#08090C;color:#F3F1EC;font-family:"Geist",system-ui,-apple-system,sans-serif}
main{min-height:100%;box-sizing:border-box;display:grid;place-content:center;gap:16px;text-align:center;padding:32px 24px}
svg{justify-self:center;width:84px;height:84px}
.w{font-family:"Big Shoulders Display",system-ui,sans-serif;font-weight:800;letter-spacing:.32em;font-size:15px;color:rgba(243,241,236,.55);margin-top:-4px}
h1{margin:14px 0 0;font-size:32px;font-weight:800;letter-spacing:.01em}
p{margin:0 auto;color:rgba(243,241,236,.62);max-width:290px;line-height:1.5;font-size:15px}
button{justify-self:center;margin-top:12px;border:0;border-radius:999px;background:#F3F1EC;color:#08090C;font-weight:700;font-size:15px;padding:14px 30px}
button:active{transform:scale(.97)}
.s{font-family:monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7C8BFF;min-height:14px}
</style></head><body><main>
<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#111318"/><path d="M38.4 15.7a17.5 17.5 0 0 1 9.6 9.9" fill="none" stroke="#7C8BFF" stroke-width="6.6" stroke-linecap="round"/><path d="M48.8 33.4A17.5 17.5 0 1 1 30.6 14.6" fill="none" stroke="#F3F1EC" stroke-width="6.6" stroke-linecap="round"/></svg>
<div class="w">ORDO</div>
<h1>You're offline.</h1>
<p>Connect to the internet once and ORDO will open without it from then on. We'll reconnect the moment you're back.</p>
<button id="b">Try again</button>
<div class="s" id="s"></div>
</main><script>
var SITE = "__SITE__";
function go(){ document.getElementById("s").textContent = "Reconnecting…"; location.replace(SITE); }
document.getElementById("b").onclick = go;
addEventListener("online", go);
setInterval(function(){ if (navigator.onLine) go(); }, 8000);
</script></body></html>
