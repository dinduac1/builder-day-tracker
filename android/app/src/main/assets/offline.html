<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDO</title>
<style>
html,body{margin:0;height:100%;background:#08090C;color:#F3F1EC;font-family:"Geist",system-ui,-apple-system,sans-serif}
main{min-height:100%;box-sizing:border-box;display:grid;place-content:center;gap:16px;text-align:center;padding:32px 24px}
.ordo-load{width:88px;height:88px;display:block;border-radius:21px;box-shadow:0 18px 50px rgba(0,0,0,.45)}.ordo-load .ol-rot{transform-origin:32px 32px;animation:ol-rot 1.5s linear infinite}.ordo-load .ol-iv{stroke-dasharray:54 110;stroke-dashoffset:-20;animation:ol-iv 1.5s ease-in-out infinite}@keyframes ol-rot{to{transform:rotate(-360deg)}}@keyframes ol-iv{0%,100%{stroke-dasharray:34 110}50%{stroke-dasharray:74 110}}.ol-word{font-family:'Big Shoulders Display',system-ui,sans-serif;font-weight:800;letter-spacing:.36em;font-size:15px;color:rgba(243,241,236,.62);margin-left:.36em}.ol-dots::after{content:'';animation:ol-dots 1.5s steps(4) infinite}@keyframes ol-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}@media (prefers-reduced-motion:reduce){.ordo-load .ol-rot{animation-duration:4s}.ordo-load .ol-iv{animation:none}}.ordo-load{justify-self:center}
.w{font-family:"Big Shoulders Display",system-ui,sans-serif;font-weight:800;letter-spacing:.32em;font-size:15px;color:rgba(243,241,236,.55);margin-top:-4px}
h1{margin:14px 0 0;font-size:32px;font-weight:800;letter-spacing:.01em}
p{margin:0 auto;color:rgba(243,241,236,.62);max-width:290px;line-height:1.5;font-size:15px}
button{justify-self:center;margin-top:12px;border:0;border-radius:999px;background:#F3F1EC;color:#08090C;font-weight:700;font-size:15px;padding:14px 30px}
button:active{transform:scale(.97)}
.s{font-family:monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7C8BFF;min-height:14px}
</style></head><body><main>
<svg class="ordo-load" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#111318"/><circle cx="32" cy="32" r="17.5" fill="none" stroke="rgba(243,241,236,.08)" stroke-width="6.6"/><g class="ol-rot"><g transform="rotate(-90 32 32)"><circle class="ol-iv" cx="32" cy="32" r="17.5" fill="none" stroke="#F3F1EC" stroke-width="6.6" stroke-linecap="round"/><circle cx="32" cy="32" r="17.5" fill="none" stroke="#7C8BFF" stroke-width="6.6" stroke-linecap="round" stroke-dasharray="11 110"/></g></g></svg>
<div class="w">ORDO</div>
<h1>You're offline.</h1>
<p>Connect to the internet once and ORDO will open without it from then on. We'll reconnect the moment you're back.</p>
<button id="b">Try again</button>
<div class="s"><span id="s">Reconnecting</span><span class="ol-dots"></span></div>
</main><script>
var SITE = "__SITE__";
function go(){ document.getElementById("s").textContent = "Connecting"; location.replace(SITE); }
document.getElementById("b").onclick = go;
addEventListener("online", go);
setInterval(function(){ if (navigator.onLine) go(); }, 8000);
</script></body></html>
