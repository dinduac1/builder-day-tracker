<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#08090C;overflow:hidden}main{height:100%;display:grid;place-content:center;justify-items:center;gap:22px}.ordo-load{width:88px;height:88px;display:block;border-radius:21px;box-shadow:0 18px 50px rgba(0,0,0,.45)}.ordo-load .ol-rot{transform-origin:32px 32px;animation:ol-rot 1.5s linear infinite}.ordo-load .ol-iv{stroke-dasharray:54 110;stroke-dashoffset:-20;animation:ol-iv 1.5s ease-in-out infinite}@keyframes ol-rot{to{transform:rotate(-360deg)}}@keyframes ol-iv{0%,100%{stroke-dasharray:34 110}50%{stroke-dasharray:74 110}}.ol-word{font-family:'Big Shoulders Display',system-ui,sans-serif;font-weight:800;letter-spacing:.36em;font-size:15px;color:rgba(243,241,236,.62);margin-left:.36em}.ol-dots::after{content:'';animation:ol-dots 1.5s steps(4) infinite}@keyframes ol-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}@media (prefers-reduced-motion:reduce){.ordo-load .ol-rot{animation-duration:4s}.ordo-load .ol-iv{animation:none}}</style></head>
<body><main><svg class="ordo-load" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#111318"/><circle cx="32" cy="32" r="17.5" fill="none" stroke="rgba(243,241,236,.08)" stroke-width="6.6"/><g class="ol-rot"><g transform="rotate(-90 32 32)"><circle class="ol-iv" cx="32" cy="32" r="17.5" fill="none" stroke="#F3F1EC" stroke-width="6.6" stroke-linecap="round"/><circle cx="32" cy="32" r="17.5" fill="none" stroke="#7C8BFF" stroke-width="6.6" stroke-linecap="round" stroke-dasharray="11 110"/></g></g></svg><div class="ol-word">ORDO</div></main></body></html>
