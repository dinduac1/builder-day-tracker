<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Geist+Mono:wght@500&display=swap">
<style>html,body{margin:0;height:100%;background:#08090C;overflow:hidden}main{height:100%;display:grid;place-content:center}</style></head>
<body><main id="m"></main><script>/* ORDO motion: animated versions of the ORDO mark. One file, used by the app's opening screen (assets/loader.html),
 * the page's sync screen (#boot in index.html), the offline "Reconnecting" screens, and loaders.html (the options page).
 *
 *   ORDOAnim.mount(host, kind, {size, word, label})   kind: "open" | "sync" | "charge" | "flap" | "rise"
 *
 * The mark: 64×64 tile, ring r=17.5 around (32,32). Ivory arc runs clockwise from 4.8° to 265.3°; the ultramarine
 * segment sits in the gap (291°–338°). Everything is drawn on one requestAnimationFrame timeline per animation.
 */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const IV = "#F3F1EC", UL = "#7C8BFF", TILE = "#111318";
  const ARC_IV = "M48.8 33.4A17.5 17.5 0 1 1 30.6 14.6", ARC_UL = "M38.4 15.7a17.5 17.5 0 0 1 9.6 9.9";
  const IV_LEN = 80, UL_LEN = 15;
  const GRADES = ["F", "D", "C", "B", "A", "A+"];
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c1 = 1.9, c3 = c1 + 1; return t <= 0 ? 0 : 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  };
  const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const pt = (deg, r = 17.5) => [32 + r * Math.cos(deg * Math.PI / 180), 32 + r * Math.sin(deg * Math.PI / 180)];
  const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function base(host, o) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "display:grid;justify-items:center;gap:18px";
    const s = el("svg", {viewBox: "0 0 64 64", width: o.size || 96, height: o.size || 96, "aria-hidden": "true"});
    s.style.overflow = "visible";
    wrap.appendChild(s);
    host.appendChild(wrap);
    el("rect", {width: 64, height: 64, rx: 15, fill: TILE}, s);
    return {wrap, s};
  }
  function caption(wrap, text) {
    const d = document.createElement("div");
    d.style.cssText = "font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7C8BFF;min-height:14px";
    d.textContent = text; wrap.appendChild(d); return d;
  }
  function wordmark(wrap, big) {
    const w = document.createElement("div");
    w.style.cssText = `display:flex;gap:${big ? ".42em" : ".36em"};font-family:'Big Shoulders Display',system-ui,sans-serif;font-weight:800;font-size:${big ? 26 : 15}px;color:${big ? IV : "rgba(243,241,236,.62)"};letter-spacing:0`;
    const L = "ORDO".split("").map(c => { const s = document.createElement("span"); s.textContent = c; s.style.display = "inline-block"; w.appendChild(s); return s; });
    wrap.appendChild(w);
    return L;
  }
  function run(T, draw) {
    let t0 = null, stopped = false;
    const f = ts => { if (stopped) return; if (t0 == null) t0 = ts; draw(((ts - t0) / 1000) % T); requestAnimationFrame(f); };
    requestAnimationFrame(f);
    return () => { stopped = true; };
  }
  const ivArc = s => el("path", {d: ARC_IV, fill: "none", stroke: IV, "stroke-width": 6.6, "stroke-linecap": "round", "stroke-dasharray": `${IV_LEN} 200`, "stroke-dashoffset": IV_LEN}, s);
  const ulArc = s => el("path", {d: ARC_UL, fill: "none", stroke: UL, "stroke-width": 6.6, "stroke-linecap": "round", "stroke-dasharray": "0 200", visibility: "hidden"}, s);
  const track = s => el("circle", {cx: 32, cy: 32, r: 17.5, fill: "none", stroke: "rgba(243,241,236,.07)", "stroke-width": 6.6}, s);
  // a zero-length dash still draws round caps as a dot, so hide the segment until it has length
  const setUL = (ul, len) => { ul.setAttribute("stroke-dasharray", `${Math.max(0, len).toFixed(2)} 200`); ul.style.visibility = len < .4 ? "hidden" : ""; };
  const glow = (p, g) => { p.style.filter = g > 0.02 ? `drop-shadow(0 0 ${(5 * g).toFixed(1)}px rgba(124,139,255,.95))` : ""; };
  function gradeText(s, size) {
    const t = el("text", {x: 32, y: 32, "text-anchor": "middle", "dominant-baseline": "central", fill: IV}, s);
    t.style.cssText = `font-family:'Big Shoulders Display',system-ui,sans-serif;font-weight:800;font-size:${size || 15}px`;
    return t;
  }

  /* Opening the app: seven days light up around the ring, merge into the ORDO mark, the seventh becomes the
     ultramarine segment, then O·R·D·O drops in. */
  function open(host, o) {
    const {wrap, s} = base(host, o);
    track(s);
    const iv = ivArc(s), ul = ulArc(s);
    const A = [4.8, 56.9, 109, 161.1, 213.2, 265.3, 314.8];
    const dots = A.map((a, i) => { const [x, y] = pt(a); return el("circle", {cx: x.toFixed(2), cy: y.toFixed(2), r: 0, fill: i === 6 ? UL : IV}, s); });
    const L = o.word === false ? [] : wordmark(wrap, true);
    return run(3.8, t => {
      dots.forEach((d, i) => {
        const on = ease.back(seg(t, .15 + i * .15, .4 + i * .15));
        const merge = i < 6 ? seg(t, 1.3 + i * .075, 1.5 + i * .075) : seg(t, 1.85, 2.05);
        d.setAttribute("r", Math.max(0, 3.5 * on * (1 - merge)).toFixed(2));
      });
      const draw = ease.inOut(seg(t, 1.25, 1.85));
      iv.setAttribute("stroke-dashoffset", (IV_LEN * (1 - draw)).toFixed(2));
      setUL(ul, UL_LEN * ease.back(seg(t, 1.85, 2.15)));
      glow(ul, seg(t, 2.1, 2.45) - seg(t, 2.8, 3.3));
      const out = seg(t, 3.35, 3.75);
      s.style.opacity = (1 - out).toFixed(3);
      L.forEach((l, j) => { const p = ease.back(seg(t, 2.05 + j * .09, 2.45 + j * .09)); l.style.transform = `translateY(${((1 - p) * -16).toFixed(1)}px)`; l.style.opacity = (Math.min(1, p * 1.5) * (1 - out)).toFixed(3); });
    });
  }

  /* Syncing: a comet draws the ring as it races round (Orbit + Assemble), the centre counts up (Grade up),
     then the comet docks into its slot as the ultramarine segment. */
  function sync(host, o) {
    const {wrap, s} = base(host, o);
    track(s);
    const iv = ivArc(s), ul = ulArc(s);
    const trail = [3.6, 2.8, 2.1, 1.5].map((r, i) => el("circle", {r, fill: UL, opacity: [1, .55, .3, .15][i]}, s));
    trail[0].style.filter = "drop-shadow(0 0 4px rgba(124,139,255,.95))";
    const pct = gradeText(s, 11);
    const cap = o.label === false ? null : caption(wrap, o.label || "Syncing");
    return run(2.9, t => {
      const p = ease.inOut(seg(t, 0, 1.35)), dock = ease.inOut(seg(t, 1.35, 1.7));
      const head = 4.8 + 260.5 * p + (314.8 - 265.3) * dock;
      iv.setAttribute("stroke-dashoffset", (IV_LEN * (1 - p)).toFixed(2));
      const retract = seg(t, 2.35, 2.85);
      if (retract > 0) iv.setAttribute("stroke-dashoffset", (-IV_LEN * ease.inOut(retract)).toFixed(2));
      const docked = t >= 1.7;
      trail.forEach((c, i) => { const [x, y] = pt(head - i * 7); c.setAttribute("cx", x.toFixed(2)); c.setAttribute("cy", y.toFixed(2)); c.style.display = docked ? "none" : ""; });
      setUL(ul, docked ? UL_LEN * ease.back(seg(t, 1.7, 1.95)) * (1 - ease.inOut(retract)) : 0);
      glow(ul, seg(t, 1.8, 2.0) - seg(t, 2.1, 2.4));
      pct.textContent = docked ? "A+" : Math.round(p * 100) + "%";
      pct.style.fontSize = docked ? "15px" : "10px";
      pct.style.opacity = (1 - retract).toFixed(2);
    });
  }

  /* Reconnecting · Charge: the ring charges up while the grade climbs F→A+; at A+ the segment snaps in with a shockwave. */
  function charge(host, o) {
    const {wrap, s} = base(host, o);
    track(s);
    const shock = el("circle", {cx: 32, cy: 32, r: 17.5, fill: "none", stroke: UL, "stroke-width": 1.4, opacity: 0}, s);
    const iv = ivArc(s), ul = ulArc(s), g = gradeText(s, 16);
    const cap = o.label === false ? null : caption(wrap, o.label || "Reconnecting");
    return run(3.3, t => {
      const f = ease.inOut(seg(t, .1, 1.9)), drain = ease.inOut(seg(t, 2.75, 3.25));
      iv.setAttribute("stroke-dashoffset", drain > 0 ? (-IV_LEN * drain).toFixed(2) : (IV_LEN * (1 - f)).toFixed(2));
      g.textContent = t >= 1.9 && drain < .5 ? "A+" : GRADES[Math.min(4, Math.floor(f * 4.999))];
      const u = ease.back(seg(t, 1.9, 2.2));
      setUL(ul, UL_LEN * u * (1 - drain));
      const sw = seg(t, 1.95, 2.7);
      shock.setAttribute("r", (17.5 + 16 * ease.out(sw)).toFixed(2)); shock.setAttribute("opacity", (sw > 0 && sw < 1 ? .8 * (1 - sw) : 0).toFixed(2));
      glow(ul, seg(t, 2, 2.3) - seg(t, 2.4, 2.75));
      const pop = seg(t, 1.9, 2.05) - seg(t, 2.05, 2.3);
      g.setAttribute("transform", `translate(32 32) scale(${(1 + .35 * pop).toFixed(3)}) translate(-32 -32)`);
      g.setAttribute("fill", t >= 1.9 && drain < .5 ? UL : IV);
    });
  }

  /* Reconnecting · Flap: the full ring sits still while the segment orbits like a scanner; the grade flips like a
     split-flap board, and the segment lands in its slot on A+. */
  function flap(host, o) {
    const {wrap, s} = base(host, o);
    const iv = el("path", {d: ARC_IV, fill: "none", stroke: IV, "stroke-width": 6.6, "stroke-linecap": "round"}, s);
    const rot = el("g", {}, s), ul = el("path", {d: ARC_UL, fill: "none", stroke: UL, "stroke-width": 6.6, "stroke-linecap": "round"}, rot);
    const card = el("rect", {x: 23, y: 23.5, width: 18, height: 17, rx: 3.2, fill: "#1b1f2b"}, s);
    el("line", {x1: 23, y1: 32, x2: 41, y2: 32, stroke: TILE, "stroke-width": .8}, s);
    const g = gradeText(s, 14);
    const cap = o.label === false ? null : caption(wrap, o.label || "Reconnecting");
    const steps = [.3, .62, .94, 1.26, 1.58, 1.9];
    return run(3.2, t => {
      const spin = ease.out(seg(t, 0, 1.95)), leave = ease.inOut(seg(t, 2.75, 3.2));
      rot.setAttribute("transform", `rotate(${(-720 * (1 - spin) + 360 * leave).toFixed(1)} 32 32)`);
      let idx = 0; steps.forEach((x, i) => { if (t >= x) idx = i; });
      if (t >= 2.75) idx = 0;
      const since = t - (steps[idx] || 0), flip = Math.min(1, since / .16);
      g.textContent = GRADES[idx];
      g.setAttribute("transform", `translate(32 32) scale(1 ${(flip < 1 ? Math.abs(Math.cos((1 - flip) * Math.PI / 2)) : 1).toFixed(3)}) translate(-32 -32)`);
      g.setAttribute("fill", idx === 5 ? UL : IV);
      glow(ul, seg(t, 1.95, 2.2) - seg(t, 2.3, 2.75));
      card.setAttribute("fill", idx === 5 ? "#20264a" : "#1b1f2b");
    });
  }

  /* Reconnecting · Rise: ultramarine rises inside the ring like a charge level with a moving wave; the grade climbs;
     when full, the segment snaps in and the level drains. */
  function rise(host, o) {
    const {wrap, s} = base(host, o);
    const id = "ol" + Math.random().toString(36).slice(2, 7);
    const defs = el("defs", {}, s), cp = el("clipPath", {id}, defs); el("circle", {cx: 32, cy: 32, r: 14.1}, cp);
    const liq = el("g", {"clip-path": `url(#${id})`}, s);
    const wave = el("path", {fill: "rgba(124,139,255,.55)"}, liq), wave2 = el("path", {fill: "rgba(124,139,255,.3)"}, liq);
    el("path", {d: ARC_IV, fill: "none", stroke: IV, "stroke-width": 6.6, "stroke-linecap": "round"}, s);
    const ul = ulArc(s), g = gradeText(s, 15);
    const cap = o.label === false ? null : caption(wrap, o.label || "Reconnecting");
    const wavePath = (lvl, ph, amp) => { let d = `M10 ${lvl}`; for (let x = 10; x <= 54; x += 2) d += ` L${x} ${(lvl + Math.sin(x / 4.2 + ph) * amp).toFixed(2)}`; return d + " L54 60 L10 60Z"; };
    return run(3.4, t => {
      const f = ease.inOut(seg(t, .05, 2.0)), drain = ease.inOut(seg(t, 2.8, 3.35)), lvl = f * (1 - drain);
      const y = 47 - 31 * lvl, ph = t * 5;
      wave.setAttribute("d", wavePath(y, ph, 1.3)); wave2.setAttribute("d", wavePath(y - .8, -ph * .8 + 1.4, 1.1));
      g.textContent = t >= 2.0 && drain < .5 ? "A+" : GRADES[Math.min(4, Math.floor(f * 4.999))];
      g.setAttribute("fill", t >= 2.0 && drain < .5 ? "#0A0C16" : IV);
      setUL(ul, UL_LEN * ease.back(seg(t, 2.0, 2.3)) * (1 - drain));
      glow(ul, seg(t, 2.05, 2.35) - seg(t, 2.45, 2.8));
    });
  }

  const KINDS = {open, sync, charge, flap, rise};
  function mount(host, kind, o) {
    o = o || {};
    if (!host) return () => {};
    host.innerHTML = "";
    const f = KINDS[kind] || sync;
    if (reduce) o = {...o};
    return f(host, o);
  }
  window.ORDOAnim = {mount, kinds: Object.keys(KINDS)};
})();

ORDOAnim.mount(document.getElementById("m"), "open", {size: 104});</script></body></html>
