<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#08090C;color:#F3F1EC;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
main{min-height:100%;display:grid;grid-template-rows:1fr auto;padding:28px 24px calc(env(safe-area-inset-bottom,0px) + 22px)}
.top{display:grid;place-content:center;justify-items:center;gap:12px;text-align:center}
.mark{width:72px;height:72px;border-radius:18px;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.w{font-weight:800;letter-spacing:.36em;font-size:13px;color:rgba(243,241,236,.55);margin-left:.36em}
h1{margin:18px 0 0;font-size:24px;font-weight:700}
.msg{min-height:20px;font-size:14px;color:rgba(243,241,236,.6)}
.msg.bad{color:#FF6E6A}
.dots{display:flex;gap:16px;justify-content:center;margin-top:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(243,241,236,.45);transition:background .12s,border-color .12s}
.dots i.on{background:#F3F1EC;border-color:#F3F1EC}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;width:100%;margin:0 auto}
.pad button{height:72px;border-radius:50%;width:72px;justify-self:center;border:0;background:#111318;color:#F3F1EC;font-size:28px;font-weight:500;font-family:inherit}
.pad button:active{background:#1d2029;transform:scale(.95)}
.pad button.ghost{background:none;font-size:15px;color:rgba(243,241,236,.7)}
.pad button svg{width:30px;height:30px}
.pw{display:grid;gap:12px;max-width:340px;width:100%;margin:0 auto}
.pw input{font:inherit;font-size:18px;padding:15px 16px;border-radius:14px;border:1px solid rgba(243,241,236,.18);background:#111318;color:#F3F1EC;outline:none}
.pw input:focus{border-color:#7C8BFF}
.btn{border:0;border-radius:999px;background:#F3F1EC;color:#08090C;font-weight:700;font-size:16px;padding:15px 24px;font-family:inherit}
.btn.sec{background:#111318;color:#F3F1EC}
.links{display:flex;justify-content:center;gap:22px;margin-top:18px}
.links button{background:none;border:0;color:#7C8BFF;font-family:monospace;font-size:12px;letter-spacing:.06em;padding:8px}
</style></head><body><main>
<div class="top">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#111318"/><path d="M38.4 15.7a17.5 17.5 0 0 1 9.6 9.9" fill="none" stroke="#7C8BFF" stroke-width="6.6" stroke-linecap="round"/><path d="M48.8 33.4A17.5 17.5 0 1 1 30.6 14.6" fill="none" stroke="#F3F1EC" stroke-width="6.6" stroke-linecap="round"/></svg>
  <div class="w">ORDO</div>
  <h1 id="title">ORDO is locked</h1>
  <div class="dots" id="dots"></div>
  <div class="msg" id="msg"></div>
</div>
<div id="bottom"></div>
</main>
<script>
var L = JSON.parse(ORDOLock.info() || "{}"), code = "", busy = false, timer = null;
var BIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 11a5 5 0 0 1 10 0c0 4-1 7-2.5 9"/><path d="M12 11v4c0 2-.6 4-1.6 5.6"/><path d="M9.5 21c.8-1.6 1-3.3 1-5v-4.5a1.5 1.5 0 0 1 3 0"/><path d="M4.5 15c.3-1.3.5-2.6.5-4a7 7 0 0 1 12.6-4.2"/><path d="M19.4 9.4c.4 1.5.5 3.1.4 4.6"/></svg>';
var $ = function(id){ return document.getElementById(id); };
function say(t, bad){ $("msg").textContent = t || ""; $("msg").className = "msg" + (bad ? " bad" : ""); }
function wait(n){
  busy = true; clearInterval(timer);
  var tick = function(){ if (n <= 0) { clearInterval(timer); busy = false; say(""); return; } say("Too many tries. Wait " + (n >= 60 ? Math.ceil(n / 60) + " min" : n + " s") + ".", true); n--; };
  tick(); timer = setInterval(tick, 1000);
}
function result(r){
  if (r === "") { say("Unlocked"); return; }
  if (r.indexOf("wait:") === 0) wait(parseInt(r.slice(5), 10)); else say(r, true);
  var t = $("dots").childElementCount ? $("dots") : document.querySelector(".pw input");
  if (t) { t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake"); }
}
function dots(){ var d = $("dots"); for (var i = 0; i < d.children.length; i++) d.children[i].className = i < code.length ? "on" : ""; }
function links(){
  var a = '<div class="links">';
  if (L.mode !== "device") a += '<button onclick="ORDOLock.forgot()">Forgot ' + (L.mode === "pin" ? "PIN" : "password") + '?</button>';
  if (L.confirm) a += '<button onclick="ORDOLock.cancel()">Cancel</button>';
  return a + "</div>";
}
window.bioCancelled = function(){ if (L.mode === "device") say("Tap Unlock to try again."); };
window.forgotUnavailable = function(){ say("Your phone has no screen lock to reset with. Clear ORDO's storage in your phone's app settings; your progress is safe in your account.", true); };
if (L.confirm) $("title").textContent = "Confirm it's you";
if (L.mode === "pin") {
  var n = L.len || 4; for (var i = 0; i < n; i++) $("dots").appendChild(document.createElement("i"));
  say("Enter your " + n + "-digit PIN");
  var keys = ["1","2","3","4","5","6","7","8","9", L.bioAllowed ? "bio" : "", "0", "del"];
  $("bottom").innerHTML = '<div class="pad">' + keys.map(function(k){
    if (!k) return "<span></span>";
    if (k === "bio") return '<button class="ghost" data-k="bio" aria-label="Fingerprint or face">' + BIO + "</button>";
    if (k === "del") return '<button class="ghost" data-k="del" aria-label="Delete">⌫</button>';
    return '<button data-k="' + k + '">' + k + "</button>";
  }).join("") + "</div>" + links();
  document.querySelectorAll(".pad button").forEach(function(b){ b.onclick = function(){
    var k = b.dataset.k;
    if (k === "bio") return ORDOLock.biometric();
    if (busy) return;
    if (k === "del") { code = code.slice(0, -1); dots(); return; }
    if (code.length >= n) return;
    code += k; dots();
    if (code.length === n) setTimeout(function(){ var r = ORDOLock.check(code); code = ""; dots(); result(r); }, 120);
  }; });
  if (L.bioAllowed) setTimeout(function(){ ORDOLock.biometric(); }, 350);
} else if (L.mode === "password") {
  say("Enter your password");
  $("bottom").innerHTML = '<div class="pw"><input type="password" autocomplete="current-password" placeholder="Password" autofocus><button class="btn" id="go">Unlock</button>'
    + (L.bioAllowed ? '<button class="btn sec" id="bio">Use fingerprint or face</button>' : "") + "</div>" + links();
  var inp = document.querySelector(".pw input");
  var go = function(){ if (busy || !inp.value) return; var r = ORDOLock.check(inp.value); if (r) inp.select(); result(r); };
  $("go").onclick = go; inp.onkeydown = function(e){ if (e.key === "Enter") go(); };
  if ($("bio")) $("bio").onclick = function(){ ORDOLock.biometric(); };
  if (L.bioAllowed) setTimeout(function(){ ORDOLock.biometric(); }, 350); else setTimeout(function(){ inp.focus(); }, 300);
} else {
  say("Fingerprint, face or your phone's PIN");
  $("bottom").innerHTML = '<div class="pw"><button class="btn" id="go">Unlock</button></div>' + links();
  $("go").onclick = function(){ ORDOLock.biometric(); };
  setTimeout(function(){ ORDOLock.biometric(); }, 300);
}
</script></body></html>
